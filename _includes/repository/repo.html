<a class="repo-card" href="https://github.com/{{ include.repository }}" target="_blank" rel="noopener" data-repo="{{ include.repository }}">
  <div class="repo-card-header">
    <i class="far fa-folder-open repo-card-icon"></i>
    <span class="repo-card-name">{{ include.repository | split: '/' | last }}</span>
  </div>
  <p class="repo-card-desc">{{ include.repository }}</p>
  <div class="repo-card-meta">
    <span class="repo-card-lang" hidden><span class="repo-card-dot"></span><span class="repo-card-lang-name"></span></span>
    <span class="repo-card-stars" hidden><i class="far fa-star"></i> <span></span></span>
    <span class="repo-card-forks" hidden><i class="fas fa-code-branch"></i> <span></span></span>
  </div>
</a>
